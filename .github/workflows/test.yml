name: test

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Model.js has no QML dependencies on purpose, so the parsing and
      # formatting rules are exercisable without a running shell.
      - run: node test/model-test.js
